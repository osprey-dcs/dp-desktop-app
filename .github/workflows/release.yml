name: Release dp-desktop-app

on:
  push:
    tags:
      - 'rel-*'
  # Rehearsal trigger.  A workflow_dispatch run builds and signs, but the publish job below is
  # gated on a rel-* tag push, so a rehearsal is structurally incapable of publishing rather
  # than relying on the operator not to.  Note that a rehearsal does sign for real: it produces
  # a permanent public Rekor entry naming the ref it ran against.
  #
  # Rehearse by dispatching against a branch (`gh workflow run release.yml --ref <branch>`).
  # The run executes the workflow file AS IT EXISTS AT THAT REF, so a PR branch rehearses the
  # PR's own copy (observed on dp-service #221's rehearsal, run 36067531985).  The same rule is
  # why a dispatch must never target rel-1.16.0: that tag's copy is the old single-job workflow,
  # whose `dry_run: false` input rebuilds unsigned and overwrites a release's jar.  Never push a
  # tag to rehearse either; a rel-* tag starts a real release.  See CLAUDE.md "Releases".
  #
  # A dispatch against a TAG ref is refused (see "Derive version"): its signing identity would
  # be release.yml@refs/tags/rel-<version>, the release's own, leaving the workflow trigger as
  # the only thing in the certificate that tells the two apart.
  workflow_dispatch:
    inputs:
      sibling_ref:
        description: "Optional branch or tag NAME applied to BOTH siblings, dp-grpc and dp-service (e.g. main). Not a commit SHA. Default: the POM's rel- tags if both exist, else main for both."
        required: false
        default: ''

# A publish must never be cancelled halfway through, so unlike CI this pins
# cancel-in-progress off.  false is already the default; it is stated explicitly so the
# intent survives a later edit rather than living only in this comment.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Three jobs, so the Sigstore OIDC token never shares a job with project code (#24 plan D1).
# A job granted `id-token: write` exposes the token-request credentials to every one of its
# steps, and `build` runs every Maven plugin in three builds, two of them from other
# repositories (dp-grpc and dp-service).  `sign` therefore has no checkout and runs nothing but
# sha256sum and cosign over what `build` uploaded.  This does not stop code in `build` from
# tampering with the jar before it is checksummed -- no job split can -- but it confines the
# signing identity to the artifacts `build` handed over, for the seconds `sign` takes.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    env:
      DP_GRPC_REPO: 'osprey-dcs/dp-grpc'
      DP_SERVICE_REPO: 'osprey-dcs/dp-service'
      # The single definition of "this run is a real release".  It must stay textually
      # identical to the publish job's `if:` below, which cannot read this env context; it is
      # repeated there rather than passed as a job output so that the job running other
      # repositories' code cannot decide whether publishing happens.  Every step that behaves
      # differently for a release keys off it.
      IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-') }}

    steps:
      - name: Checkout
        # Actions are pinned to commit SHAs rather than floating major tags: this workflow
        # publishes release artifacts, so a compromised upstream tag here could replace what
        # users download.  Dependabot (.github/dependabot.yml) keeps the pins current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # The discriminator throughout this job is the EVENT, not the ref type: only a rel-* tag
      # push is a release, and that is exactly what gates the publish job below.  Keying off
      # GITHUB_REF_TYPE instead would misclassify a workflow_dispatch run against a tag as a
      # release.
      #
      # On a release the version comes from the tag, and must agree with the POM on
      # project.version, dp-grpc.version and dp-service.version.  The jar is renamed to the
      # tag's version whatever the POM says, and the siblings are checked out at rel-<tag
      # version> while Maven resolves the POM's versions, so a tag pushed on an unbumped POM
      # would otherwise publish and sign a jar whose name, self-reported version, and
      # dependencies disagree.
      #
      # A rehearsal takes the POM's version, so it produces the same filenames a release does.
      # A rehearsal against a tag ref is refused outright (see the comment on the trigger).
      #
      # The version becomes a filename and is handed to the sign job, which holds the signing
      # token, so anything outside a plain version alphabet is rejected here.  The leading digit
      # rules out a value starting with `-` being read as an option.
      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          POM_VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "${IS_RELEASE}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#rel-}"
            POM_GRPC_VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=dp-grpc.version)
            POM_SERVICE_VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=dp-service.version)
            if [ "$VERSION" != "$POM_VERSION" ] || [ "$VERSION" != "$POM_GRPC_VERSION" ] || [ "$VERSION" != "$POM_SERVICE_VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match the POM (project.version=${POM_VERSION}, dp-grpc.version=${POM_GRPC_VERSION}, dp-service.version=${POM_SERVICE_VERSION}). Bump the POM and retag."
              exit 1
            fi
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Refusing to rehearse against tag ${GITHUB_REF_NAME}: its signature would carry the release's own identity. Dispatch against a branch."
            exit 1
          else
            VERSION="$POM_VERSION"
          fi
          if ! [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Refusing version '$VERSION': must start with a digit and stay within [0-9A-Za-z.+-]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION (release run: $IS_RELEASE)"

      # Checked before the build rather than left to action-gh-release, which fails the job on
      # a missing body_path only after dp-grpc, dp-service and this app have all been built.
      # Every release from 1.16.0 on ships notes; see CLAUDE.md "Releases".  Skipped on a
      # rehearsal, which publishes nothing and so has no release body to look for.
      #
      # The path is derived from VERSION; on a release that is the tag minus `rel-`, so it is
      # the same file the siblings resolve from GITHUB_REF_NAME.
      - name: Verify release notes exist
        if: env.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          NOTES="doc/release-notes/rel-${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Release notes not found at $NOTES."
            echo "::error::Add the notes for ${VERSION} and re-run, or retag once they are on the tagged commit."
            exit 1
          fi
          echo "NOTES_PATH=$NOTES" >> "$GITHUB_ENV"

      # A release builds strictly against rel-${VERSION} of BOTH siblings, and fails here, before
      # any build, if either has not been tagged: that is the dependency-order check (dp-service
      # #250).  Do not soften it into a fallback.  Without it the failure surfaced only at a
      # sibling checkout, with no hint of the order.
      #
      # A rehearsal resolves the two siblings together, never independently: the sibling_ref
      # input if given, else the POM's rel- tags if BOTH exist, else main for both.  An
      # independent fallback could pair a tagged dp-grpc with dp-service main -- a combination
      # no release ever builds, and the one most likely to fail for reasons unrelated to the
      # change being rehearsed (#24 plan D4).
      #
      # sibling_ref arrives through env, never spliced into the script with ${{ }}.  It must be a
      # branch or tag name: one value names the ref in two repositories, which a commit SHA
      # cannot do, and `git ls-remote` matches ref names only, so a SHA is reported as missing.
      - name: Resolve sibling refs
        id: siblings
        env:
          SIBLING_REF: ${{ inputs.sibling_ref }}
        run: |
          set -euo pipefail
          # Prints nothing; returns 0 if the ref exists, 2 if it does not, and fails the step
          # on anything else, which is a failure to reach the repository and must not be
          # reported as a missing ref.
          ref_exists() {
            local repo="$1" ref="$2" rc=0
            git ls-remote --exit-code "https://github.com/${repo}.git" "$ref" >/dev/null || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
              echo "::error::Could not query ${repo} for ${ref} (git ls-remote exit ${rc}). This is not a missing ref; re-run the workflow."
              exit 1
            fi
            return "$rc"
          }
          if [ "${IS_RELEASE}" = "true" ]; then
            GRPC_REF="rel-${VERSION}"
            SERVICE_REF="rel-${VERSION}"
            for repo in "$DP_GRPC_REPO" "$DP_SERVICE_REPO"; do
              if ! ref_exists "$repo" "refs/tags/rel-${VERSION}"; then
                echo "::error::${repo} has no tag rel-${VERSION}. Releases are tagged in dependency order -- dp-grpc, then dp-service, then dp-desktop-app -- and a dp-desktop-app release builds only against the matching sibling tags. Tag ${repo} first, then re-run this workflow."
                exit 1
              fi
            done
            echo "Sibling refs: dp-grpc ${GRPC_REF}, dp-service ${SERVICE_REF} (release: strict match to the tag)"
          elif [ -n "${SIBLING_REF}" ]; then
            for repo in "$DP_GRPC_REPO" "$DP_SERVICE_REPO"; do
              if ! ref_exists "$repo" "$SIBLING_REF"; then
                echo "::error::sibling_ref '${SIBLING_REF}' does not exist in ${repo}."
                exit 1
              fi
            done
            GRPC_REF="$SIBLING_REF"
            SERVICE_REF="$SIBLING_REF"
            echo "Sibling refs: ${SIBLING_REF} for both (rehearsal: sibling_ref input)"
          else
            WANT_GRPC=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=dp-grpc.version)
            WANT_SERVICE=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=dp-service.version)
            if ref_exists "$DP_GRPC_REPO" "refs/tags/rel-${WANT_GRPC}" \
               && ref_exists "$DP_SERVICE_REPO" "refs/tags/rel-${WANT_SERVICE}"; then
              GRPC_REF="rel-${WANT_GRPC}"
              SERVICE_REF="rel-${WANT_SERVICE}"
              echo "Sibling refs: dp-grpc ${GRPC_REF}, dp-service ${SERVICE_REF} (rehearsal: POM versions)"
            else
              GRPC_REF="main"
              SERVICE_REF="main"
              echo "::warning::rel-${WANT_GRPC} (dp-grpc) and rel-${WANT_SERVICE} (dp-service) do not both exist; rehearsal uses main for both"
            fi
          fi
          echo "grpc=$GRPC_REF" >> "$GITHUB_OUTPUT"
          echo "service=$SERVICE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout dp-grpc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DP_GRPC_REPO }}
          ref: ${{ steps.siblings.outputs.grpc }}
          path: dp-grpc

      - name: Build and install dp-grpc
        working-directory: dp-grpc
        run: mvn -B install -DskipTests

      - name: Checkout dp-service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DP_SERVICE_REPO }}
          ref: ${{ steps.siblings.outputs.service }}
          path: dp-service

      - name: Build and install dp-service
        working-directory: dp-service
        run: mvn -B install -DskipTests

      - name: Build shaded JAR
        run: mvn -B -DskipTests package

      - name: Prepare release artifact
        run: |
          set -euo pipefail
          ls -l target
          shopt -s nullglob
          JARS=(target/dp-desktop-app-*-shaded.jar)
          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "::error::expected exactly one shaded JAR in target/, found ${#JARS[@]}"
            exit 1
          fi
          mkdir -p release
          cp "${JARS[0]}" "release/dp-desktop-app-${VERSION}.jar"

      - name: Verify release artifact
        run: |
          set -euo pipefail
          test -f "release/dp-desktop-app-${VERSION}.jar" || \
            (echo "::error::Missing dp-desktop-app-${VERSION}.jar" && exit 1)
          ls -la release

      # The notes file travels with the jar so the publish job can use it as body_path without
      # a second checkout.  On a rehearsal there is no notes file, so a placeholder is staged
      # instead: the upload below treats a missing path as an error, and a rehearsal should fail
      # on a real problem, not on the absence of something it was never going to publish.
      #
      # Gated on IS_RELEASE rather than GITHUB_REF_TYPE: NOTES_PATH is set only by the
      # release-only step above, so a dispatch against a tag would reference it unset and abort
      # under `set -u`.  "Derive version" refuses such a run first; this gate should not
      # depend on that.
      - name: Stage release notes
        run: |
          set -euo pipefail
          if [ "${IS_RELEASE}" = "true" ]; then
            cp "${NOTES_PATH}" release/RELEASE_NOTES.md
          else
            echo "Rehearsal run -- not a release; no notes staged." > release/RELEASE_NOTES.md
          fi

      - name: Upload build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-outputs
          path: |
            release/dp-desktop-app-${{ env.VERSION }}.jar
            release/RELEASE_NOTES.md
          if-no-files-found: error
          # Long enough to re-run a failed publish ("re-run, not retag"): a re-run downloads
          # these, so after they expire the only recovery is a full re-run, which re-signs.
          retention-days: 30

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Sigstore keyless OIDC; the only job that has it

    # No checkout, and nothing from the repository runs here (see the comment above `jobs:`).
    # VERSION is repository content on a rehearsal, so it is read through the environment and
    # quoted in shell, never spliced into a script with ${{ }}.
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-outputs
          path: release

      # working-directory matters here: sha256sum records the path it was given, so generating
      # from inside release/ produces bare filenames.  Consumers verify in a download directory
      # with no release/ subdirectory, and the `release/dp-desktop-app-...` entry every .sha256
      # through 1.16.0 recorded made `sha256sum -c` fail for them.
      - name: Generate SHA256SUMS
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum "dp-desktop-app-${VERSION}.jar" > SHA256SUMS
          cat SHA256SUMS

      # cosign-release is pinned rather than taken from the installer's default, which moves
      # with the installer under a Dependabot bump -- and Dependabot does not track this input,
      # so nothing flags it falling behind.  v3.1.3 rather than the siblings' v3.0.6: every
      # version up to v3.1.2 has a verify-side identity bypass (GHSA-fx35-mq7g-6g98).  README.env
      # names v3.1.3 as the MINIMUM verifier, which is what protects users.  (#24 plan D10)
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # One signature over the consolidated checksum file covers every artifact it lists.
      # One retry: dp-service #221's rehearsal lost this step to a connection reset at the
      # Sigstore timestamp authority.  The retry rewrites the bundle whole, so a failed first
      # attempt leaves nothing behind but an orphaned transparency-log entry.
      - name: Sign checksums
        working-directory: release
        run: |
          set -euo pipefail
          sign() { cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS; }
          sign || {
            echo "::warning::cosign sign-blob failed; retrying once in 30s"
            sleep 30
            sign
          }

      # Verify the bundle just produced, with the exact identity README.env documents, before
      # anything is uploaded.  On a release this IS the published command: the identity resolves
      # to release.yml@refs/tags/rel-<version> and the trigger to `push`.  On a rehearsal the
      # same expressions resolve to the branch and `workflow_dispatch`, so every rehearsal
      # exercises the check.  The release-only paths cannot be rehearsed, and without this a
      # certificate the documented command rejects -- after a workflow rename, say -- would
      # publish, and the first to find out would be a user.
      #
      # The workflow filename is written literally, as README.env writes it, rather than taken
      # from `github.workflow_ref`, so a renamed workflow fails here instead of verifying against
      # its own new name.
      - name: Verify signature
        working-directory: release
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "Verifying against identity ${IDENTITY} (trigger ${TRIGGER})"
          cosign verify-blob \
            --bundle SHA256SUMS.cosign.bundle \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-trigger "${TRIGGER}" \
            SHA256SUMS

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: |
            release/SHA256SUMS
            release/SHA256SUMS.cosign.bundle
          if-no-files-found: error
          # Long enough to re-run a failed publish ("re-run, not retag"): a re-run downloads
          # these, so after they expire the only recovery is a full re-run, which re-signs.
          retention-days: 30

  publish:
    needs: [build, sign]
    # Only a rel-* tag push publishes; a workflow_dispatch rehearsal stops after signing.
    # Textually identical to the build job's IS_RELEASE -- keep the two in step.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release write; no signing token in scope

    # GITHUB_ENV does not cross jobs, so VERSION is bound from build's output, as in sign.
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-outputs
          path: release

      - name: Download signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signatures
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The event's own tag, not a value derived from build's outputs: the release is
          # published to exactly the tag that was pushed.  This equals the action's default on
          # a tag push, the only event that reaches this job; it is stated so the intent does not
          # depend on that default.
          tag_name: ${{ github.ref_name }}
          files: |
            release/dp-desktop-app-${{ env.VERSION }}.jar
            release/SHA256SUMS
            release/SHA256SUMS.cosign.bundle
          # The hand-written notes are the release body verbatim; see CLAUDE.md "Releases".
          body_path: release/RELEASE_NOTES.md
          # Without this a glob matching nothing publishes a release quietly missing an
          # asset -- here, potentially a release with no signature and no failure.
          fail_on_unmatched_files: true
          # Overwrites assets of the SAME name; it does not remove assets whose names are no
          # longer produced.  Only a re-cut of rel-1.16.0 can reach this: an older tag re-pushed
          # runs its own commit's workflow, and moving one onto a commit carrying this workflow
          # fails the tag/POM check.  Such a re-cut would leave rel-1.16.0's
          # dp-desktop-app-1.16.0.jar.sha256 beside the new SHA256SUMS -- unsigned, and recording
          # the old broken `release/`-prefixed path.  Delete that asset by hand first.
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
