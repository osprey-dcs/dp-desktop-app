name: Release dp-desktop-app

on:
  push:
    tags:
      - 'rel-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#rel-}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Checkout dp-grpc
        uses: actions/checkout@v4
        with:
          repository: osprey-dcs/dp-grpc
          ref: rel-${{ env.VERSION }}
          path: dp-grpc

      - name: Build and install dp-grpc
        run: |
          cd dp-grpc
          mvn -B install -DskipTests

      - name: Checkout dp-service
        uses: actions/checkout@v4
        with:
          repository: osprey-dcs/dp-service
          ref: rel-${{ env.VERSION }}
          path: dp-service

      - name: Build and install dp-service
        run: |
          cd dp-service
          mvn -B install -DskipTests

      - name: Build shaded JAR
        run: mvn -B -DskipTests package

      - name: Locate shaded JAR
        run: |
          ls -l target
          SHADED_JAR=$(ls target/dp-desktop-app-*-shaded.jar 2>/dev/null | head -n 1)
          if [ -z "$SHADED_JAR" ]; then
            echo "ERROR: shaded JAR not found"
            exit 1
          fi
          echo "SHADED_JAR=$SHADED_JAR" >> $GITHUB_ENV

      - name: Prepare release artifact
        run: |
          mkdir -p release
          cp "$SHADED_JAR" "release/dp-desktop-app-${VERSION}.jar"
          
      - name: Verify release artifacts
        run: |
          echo "Release directory contents:"
          ls -la release

      - name: Generate checksum
        run: |
          sha256sum release/dp-desktop-app-${VERSION}.jar \
            > release/dp-desktop-app-${VERSION}.jar.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/dp-desktop-app-${{ env.VERSION }}.jar
            release/dp-desktop-app-${{ env.VERSION }}.jar.sha256
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
