name: Release dp-desktop-app

on:
  push:
    tags:
      - 'rel-*'
  # Manual dispatch is a rehearsal by default: it builds the app end to end, including the
  # dp-grpc and dp-service dependencies, but stops before publishing.  Publishing is gated
  # on dry_run, and the tag push path is unaffected.  Without this the workflow could only
  # be exercised by cutting a real release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the rel- prefix (e.g. 1.15.0).  Must exist as rel-<version> in dp-grpc and dp-service."
        required: true
      dry_run:
        description: "Build only; do not publish a GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      # A dry run builds and verifies the artifact but never publishes a release.  A rel-*
      # tag push always publishes; a manual dispatch defaults to a dry run and must opt in.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - name: Checkout
        # Actions are pinned to commit SHAs rather than floating major tags: this job runs
        # with `contents: write` and publishes release artifacts, so a compromised upstream
        # tag here could replace what users download.  Dependabot (.github/dependabot.yml)
        # keeps the pins current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Determine version
        # On a tag push the version comes from the tag.  On a manual dispatch GITHUB_REF_NAME
        # is the branch, not a tag, so the version has to be supplied as an input -- it
        # selects which rel-<version> of dp-grpc and dp-service to build against.
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#rel-}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" != rel-* ]]; then
              echo "::error::Tag does not start with 'rel-': $TAG"
              exit 1
            fi
            VERSION="${TAG#rel-}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version ${VERSION}"

      # Checked before the build rather than left to action-gh-release, which fails the job on
      # a missing body_path only after dp-grpc, dp-service and this app have all been built --
      # the longest build of the three repos.  Every release from 1.16.0 on ships notes; see
      # CLAUDE.md "Releases".
      #
      # The path is derived from VERSION, not from GITHUB_REF_NAME as in dp-grpc and dp-service:
      # on a manual dispatch GITHUB_REF_NAME is the branch, so it would look for
      # doc/release-notes/main.md.  On a tag push the two are identical.
      - name: Verify release notes exist
        run: |
          set -euo pipefail
          NOTES="doc/release-notes/rel-${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            # A dry run rehearses the build before the notes are written, so it warns rather
            # than failing; the publishing paths always fail.  DRY_RUN is a job-level env and
            # so always exported -- as the empty string on a tag push, which set -u would
            # otherwise trip on.
            if [[ "${DRY_RUN:-}" == "true" ]]; then
              echo "::warning::Release notes not found at $NOTES -- a real run would fail here."
              exit 0
            fi
            echo "::error::Release notes not found at $NOTES."
            echo "::error::Add the notes for ${VERSION} and re-run, or retag once they are on the tagged commit."
            exit 1
          fi
          echo "NOTES_PATH=$NOTES" >> "$GITHUB_ENV"

      - name: Checkout dp-grpc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: osprey-dcs/dp-grpc
          ref: rel-${{ env.VERSION }}
          path: dp-grpc

      - name: Build and install dp-grpc
        run: |
          cd dp-grpc
          mvn -B install -DskipTests

      - name: Checkout dp-service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: osprey-dcs/dp-service
          ref: rel-${{ env.VERSION }}
          path: dp-service

      - name: Build and install dp-service
        run: |
          cd dp-service
          mvn -B install -DskipTests

      - name: Build shaded JAR
        run: mvn -B -DskipTests package

      - name: Locate shaded JAR
        run: |
          ls -l target
          SHADED_JAR=$(ls target/dp-desktop-app-*-shaded.jar 2>/dev/null | head -n 1)
          if [ -z "$SHADED_JAR" ]; then
            echo "ERROR: shaded JAR not found"
            exit 1
          fi
          echo "SHADED_JAR=$SHADED_JAR" >> $GITHUB_ENV

      - name: Prepare release artifact
        run: |
          mkdir -p release
          cp "$SHADED_JAR" "release/dp-desktop-app-${VERSION}.jar"
          
      - name: Verify release artifacts
        run: |
          echo "Release directory contents:"
          ls -la release

      - name: Generate checksum
        run: |
          sha256sum release/dp-desktop-app-${VERSION}.jar \
            > release/dp-desktop-app-${VERSION}.jar.sha256

      - name: Publish GitHub Release
        # The only step that writes anything outside the runner.  Skipped on a dry run, so a
        # rehearsal builds and verifies the artifact but never creates a release.
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Explicit, because tag_name defaults to github.ref_name -- which on a manual
          # dispatch is the selected BRANCH, not a tag.  Left implicit, a non-dry-run
          # dispatch from main would create or update a release tagged "main" carrying
          # rel-<version> artifacts and notes.  The tag-push path is unchanged: there
          # VERSION is derived from the tag, so this resolves to the same ref_name.
          tag_name: rel-${{ env.VERSION }}
          files: |
            release/dp-desktop-app-${{ env.VERSION }}.jar
            release/dp-desktop-app-${{ env.VERSION }}.jar.sha256
          body_path: ${{ env.NOTES_PATH }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report what a real run would publish
        if: env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          {
            echo "### Dry run — nothing was published"
            echo
            echo "Built version \`${VERSION}\` against dp-grpc and dp-service \`rel-${VERSION}\`."
            echo
            echo "A real run would publish these as a GitHub Release:"
            echo
            echo '```'
            ls -l release
            echo '```'
            echo
            echo "Re-dispatch with \`dry_run: false\`, or push a \`rel-*\` tag, to publish."
          } >> "$GITHUB_STEP_SUMMARY"
